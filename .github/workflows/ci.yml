name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This workflow only ever reads. Screenshots leave as an artifact, which needs
# no write access and no privileged second job: see docs/decisions/Let the
# author attach the screenshots.md.
permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install screenshot tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick fonts-dejavu-core

      - name: Resolve Chrome
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_BIN=google-chrome" >> "$GITHUB_ENV"
            google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME_BIN=chromium" >> "$GITHUB_ENV"
            chromium --version
          else
            echo "::error::Neither google-chrome nor chromium is available; npm run shot needs a headless Chrome binary."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify -- --no-cache

      # Kept as an artifact rather than posted into the PR: producing it needs no
      # more than the read-only token this job already holds. The screenshots a
      # reviewer looks at are attached by the author; these exist so that claim
      # can be checked against a run of the PR's own code.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-screenshots
          path: .art/shots/
          if-no-files-found: warn
          retention-days: 7

  verify-windows:
    name: Verify (Windows)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check Chrome
        shell: pwsh
        run: |
          $chrome = (Get-Command chrome.exe -ErrorAction SilentlyContinue).Source
          if (-not $chrome) {
            $chrome = @(
              (Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'),
              (Join-Path ${env:ProgramFiles(x86)} 'Google\Chrome\Application\chrome.exe'),
              (Join-Path $env:LOCALAPPDATA 'Google\Chrome\Application\chrome.exe')
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $chrome) {
            throw 'Google Chrome was not found on PATH or in its standard installation folders.'
          }
          & $chrome --version

      - name: Install ImageMagick
        shell: pwsh
        run: |
          if (-not (Get-Command magick.exe -ErrorAction SilentlyContinue)) {
            choco install imagemagick --yes --no-progress
            $magick = Get-ChildItem $env:ProgramFiles -Directory -Filter 'ImageMagick*' |
              Select-Object -First 1
            if (-not $magick) {
              throw 'ImageMagick installed but magick.exe was not found.'
            }
            $magick.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
          magick -version

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify -- --no-cache

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-screenshots-windows
          path: .art/shots/
          if-no-files-found: warn
          retention-days: 7
